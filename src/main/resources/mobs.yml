# Pandora 自定义实体默认示例
# 语法尽量靠近 MythicMobs，但目前只实现常用字段。

SkeletonKing:
  Type: WITHER_SKELETON
  Display: '&cSkeleton King'
  Health: 200
  Damage: 10
  Armor: 5
  Faction: Undead
  Options:
    Silent: true
    PreventOtherDrops: true
    Despawn: true
    MovementSpeed: 0.3
  Skills:
    onSpawn:
      - FireNova
    onHurt:
      - FireNova
      - SelfHeal
    onAttack:
      - ConeFlame
    onKill:
      - SummonMinions
  Drops:
    - minecraft:diamond 1-3 0.1

FireZombie:
  Type: ZOMBIE
  Display: '&6Fire Zombie'
  Health: 40
  Damage: 5
  Armor: 2
  Options:
    Despawn: true
  Skills:
    onSpawn:
      - FireNova
    onAttack:
      - LavaPunish

SkeletonArcher:
  Type: SKELETON
  Display: '&eSkeleton Archer'
  Health: 30
  Damage: 4
  Armor: 1
  Options:
    Despawn: true
  Skills:
    onAttack:
      - ConeFlame
