# Pandora 刷怪点示例
# 每个文件对应一个或多个刷怪点定义，文件名可自由命名。
# 插件会自动加载 spawners/ 目录下所有 .yml 文件。
#
# 配置说明：
# Mob: 要刷新的实体 ID（在 mobs/ 目录中定义）
# World: 世界名称（必须在 config.yml 的世界过滤列表中）
# X, Y, Z: 刷怪点中心坐标
# Radius: 刷新半径（实体会在此范围内随机生成）
# MaxMobs: 此刷怪点最多同时存在的实体数量
# Interval: 刷新间隔（支持格式：10s=10秒, 200=200tick, 5000ms=5000毫秒）
# SpawnAmount: 每次刷新生成的实体数量（可选，默认为 1）
# Enabled: 是否启用此刷怪点（可选，默认为 true）
#
# Despawn: 实体消失配置（可选）
#   Distance: 玩家离开多远后实体可能消失（方块）
#   Delay: 超过距离后多久消失（秒）
#   RemoveWhenFarAway: 是否允许自然消失（true/false）
#
# Conditions: 刷新条件（可选，所有条件都满足才会刷新）
#   - playersInRadius{r=半径;min=最小玩家数} : 范围内至少有指定数量的玩家
#   - time{from=开始时间;to=结束时间} : 游戏时间在指定范围内（0-23999）
#   - js{file=脚本文件;func=函数名} : 自定义 JavaScript 条件

UndeadCamp1:
  Mob: SkeletonKing
  World: world
  X: 100
  Y: 64
  Z: 200
  Radius: 10
  MaxMobs: 3
  Interval: 20s
  SpawnAmount: 1
  Enabled: true
  Despawn:
    Distance: 128
    Delay: 30
    RemoveWhenFarAway: true
  Conditions:
    - playersInRadius{r=30;min=1}
    - time{from=13000;to=23000}

FirePit:
  Mob: FireZombie
  World: world
  X: 110
  Y: 64
  Z: 210
  Radius: 8
  MaxMobs: 6
  Interval: 10s
  SpawnAmount: 2
  Enabled: true
  Despawn:
    Distance: 96
    Delay: 20
    RemoveWhenFarAway: true
  Conditions:
    - playersInRadius{r=25;min=1}
